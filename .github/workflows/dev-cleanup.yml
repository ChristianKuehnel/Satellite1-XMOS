# Retention/cleanup for Satellite1 XMOS dev-build releases.
#
# Deletes pinned `dev-*` pre-releases older than RETENTION_DAYS (default 180).
# The rolling `dev-latest` release and all real (non-pre-release) releases are
# never touched. Runs monthly on a schedule and on manual dispatch.

name: Dev Cleanup

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  RETENTION_DAYS: "180"

jobs:
  cleanup:
    name: Prune expired dev releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run cleanup
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_DAYS: ${{ env.RETENTION_DAYS }}
        run: |
          bash tools/ci/cleanup_dev_releases.sh
