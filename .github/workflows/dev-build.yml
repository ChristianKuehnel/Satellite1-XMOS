# Dev-build CI for the Satellite1 XMOS firmware.
#
# On every push to `develop` (and on manual dispatch) this workflow:
#   1. Builds the firmware in the official XCORE builder container.
#   2. Embeds `git describe --always --dirty` into the binary at compile time.
#   3. Publishes an immutable per-push pre-release (dev-YYYYMMDD-<sha>),
#      refreshes the rolling `dev-latest` release, and updates a releases.json
#      index served from the GitHub Pages branch.
#
# Retention of the pinned dev-* releases is handled by dev-cleanup.yml.

name: Dev Build

on:
  push:
    branches:
      - "develop"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: false

env:
  XCORE_BUILDER: "ghcr.io/xmos/xcore_builder:v3.1"
  DEV_ASSETS_ARTIFACT_NAME: "dev_assets"
  DEV_LATEST_TAG: "dev-latest"

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    outputs:
      build_commit: ${{ github.sha }}
      build_version: ${{ steps.version.outputs.version }}
      build_describe: ${{ steps.version.outputs.describe }}
      build_tag: ${{ steps.version.outputs.tag }}
      build_date: ${{ steps.version.outputs.date }}
      build_branch: ${{ github.ref_name }}
    steps:
      - name: Checkout (full history for git describe + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute embedded version strings
        id: version
        run: |
          set -euo pipefail
          # Capture the build identifier on the clean, freshly-checked-out tree,
          # before any later step dirties the working copy.
          DESCRIBE="$(git describe --always --dirty)"
          printf '%s\n' "$DESCRIBE" > git_describe.txt

          # Derive a valid semver base from the latest vX.Y.Z release tag, else
          # v0.0.0. Never use `git describe --tags --abbrev=0` here: it would
          # match dev-* tags and break the semver parser in versioning.py.
          BASE="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1 || true)"
          BASE="${BASE:-v0.0.0}"
          BASE="$(printf '%s' "$BASE" | sed -E 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+).*$/v\1.\2.\3/')"
          VERSION="${BASE}-dev"
          printf '%s\n' "$VERSION" > firmware_version.txt

          SHORT="$(git rev-parse --short HEAD)"
          DATE_COMPACT="$(date -u +%Y%m%d)"

          echo "version=$VERSION"      >> "$GITHUB_OUTPUT"
          echo "describe=$DESCRIBE"    >> "$GITHUB_OUTPUT"
          echo "tag=dev-${DATE_COMPACT}-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo ">> Embedding version=$VERSION describe=$DESCRIBE tag=dev-${DATE_COMPACT}-${SHORT}"

      - name: Pull Docker builder
        run: |
          docker pull ${XCORE_BUILDER}

      - name: Build
        run: |
          docker run --rm -u $(id -u):$(id -g) -w /ws -v ${{ github.workspace }}:/ws ${XCORE_BUILDER} bash -l tools/ci/build_firmware.sh tools/ci/firmwares.txt

      - name: Generate checksums and stage assets
        run: |
          set -euo pipefail
          rm -rf assets
          mkdir -p assets
          shopt -s nullglob
          for b in dist/*.bin; do
            bn="$(basename "$b")"
            cp "$b" "assets/$bn"
            ( cd dist && sha256sum "$bn" > "../assets/$bn.sha256" )
            echo "staged: $bn + $bn.sha256"
          done
          if [ -z "$(ls -A assets)" ]; then
            echo "ERROR: no .bin artifacts produced in dist/"
            exit 1
          fi

      - name: Upload build assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEV_ASSETS_ARTIFACT_NAME }}
          path: ./assets

  publish:
    name: Publish dev release
    runs-on: ubuntu-latest
    needs: build
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEV_BUILD_COMMIT: ${{ needs.build.outputs.build_commit }}
      DEV_BUILD_VERSION: ${{ needs.build.outputs.build_version }}
      DEV_BUILD_GIT_DESCRIBE: ${{ needs.build.outputs.build_describe }}
      DEV_BUILD_TAG: ${{ needs.build.outputs.build_tag }}
      DEV_LATEST_TAG: ${{ env.DEV_LATEST_TAG }}
      DEV_BUILD_DATE: ${{ needs.build.outputs.build_date }}
      DEV_BUILD_BRANCH: ${{ needs.build.outputs.build_branch }}
      ASSETS_DIR: ${{ github.workspace }}/assets
      GH_PAGES_BRANCH: "gh-pages"
    steps:
      - name: Download build assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DEV_ASSETS_ARTIFACT_NAME }}
          path: ./assets

      - name: Publish release + index
        run: |
          bash tools/ci/publish_dev_release.sh
